<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Million Checkboxes</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #loginBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #64b5f6 0%, #81c784 100%);
            border: none;
            border-radius: 10px;
            color: #0a0e27;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(100, 181, 246, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }
        #loginBtn:hover { opacity: 0.85; box-shadow: 0 6px 20px rgba(100, 181, 246, 0.5); }
        #loginBtn:active { transform: scale(0.97); }
        #logoutBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #e57373 0%, #c62828 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(229, 115, 115, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }
        #logoutBtn:hover { opacity: 0.85; box-shadow: 0 6px 20px rgba(229, 115, 115, 0.5); }
        #logoutBtn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <h1> Checkboxes </h1>
    <div id="error-message" class="error-message"></div>
    <div id="container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('container')

        const errorDiv = document.getElementById('error-message');

        socket.on('server:error', (data) => {
            console.error('Server error:', data.error);
            errorDiv.textContent = data.error;
            errorDiv.classList.remove('show');
            void errorDiv.offsetWidth;
            errorDiv.classList.add('show');
        });

        socket.on('client:checkbox:changed', (data) => {
            console.log(`[Socket server event]`, data)
            const {index, checked} = data

            const input = document.getElementById(`checkbox-${index}`)
            if(input){
                input.checked = checked
            }
        })

        async function fetchStateFromServer() {
            while (container.firstChild){
                container.removeChild(container.firstChild)
            }
            const response = await fetch('/checkboxes', {method: 'GET'})
            const data = await response.json()

            if(data && data.checkboxes){
                data.checkboxes.forEach((serverValue, index) => {

                    const input = document.createElement('input')
                    input.type = 'checkbox'
                    input.id = `checkbox-${index}`
                    input.checked = serverValue

                    input.addEventListener('change', event => {
                    const checked = event.target.checked
                    socket.emit('client:checkbox:changed', {index, checked, token})
                    fetchStateFromServer()
                    })

                    container.appendChild(input) 

                })
            }
        }

     
        const token = localStorage.getItem('token');

        if (!token) {
            const loginBtn = document.createElement('button');
            loginBtn.id = 'loginBtn';
            loginBtn.innerText = 'Login to Edit';
            loginBtn.onclick = () => window.location.href = '/login';
            document.body.appendChild(loginBtn);
        } else {
            const logoutBtn = document.createElement('button');
            logoutBtn.id = 'logoutBtn';
            logoutBtn.innerText = 'Logout';
            logoutBtn.onclick = () => {
                localStorage.removeItem('token');
                window.location.reload();
            };
            document.body.appendChild(logoutBtn);
        }

        window.addEventListener('load', async () => {
            fetchStateFromServer();
        })
   
    </script>
</body>

</html>
