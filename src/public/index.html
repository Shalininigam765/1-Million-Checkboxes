<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Million Checkboxes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1> Checkboxes </h1>
    <div id="error-message" class="error-message"></div>
    <div id="container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('container')

        const errorDiv = document.getElementById('error-message');

        socket.on('server:error', (data) => {
            console.error('Server error:', data.error);
            errorDiv.textContent = data.error;
            errorDiv.classList.remove('show');
            void errorDiv.offsetWidth;
            errorDiv.classList.add('show');
        });

        socket.on('client:checkbox:changed', (data) => {
            console.log(`[Socket server event]`, data)
            const {index, checked} = data

            const input = document.getElementById(`checkbox-${index}`)
            if(input){
                input.checked = checked
            }
        })

        async function fetchStateFromServer() {
            while (container.firstChild){
                container.removeChild(container.firstChild)
            }
            const response = await fetch('/checkboxes', {method: 'GET'})
            const data = await response.json()

            if(data && data.checkboxes){
                data.checkboxes.forEach((serverValue, index) => {

                    const input = document.createElement('input')
                    input.type = 'checkbox'
                    input.id = `checkbox-${index}`
                    input.checked = serverValue

                    input.addEventListener('change', event => {
                    const checked = event.target.checked
                    socket.emit('client:checkbox:changed', {index, checked})
                    fetchStateFromServer()
                    })

                    container.appendChild(input) 

                })
            }
        }

        window.addEventListener('load', async () => {
            fetchStateFromServer();
        })
   
    </script>
</body>

</html>
